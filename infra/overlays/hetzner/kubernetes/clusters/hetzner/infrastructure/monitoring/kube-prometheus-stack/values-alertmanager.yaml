customRules:
  KubePodNotReady:  {for: 1m}
  KubePodCrashLooping: {for: 1m}
  KubeDeploymentReplicasMismatch: {for: 1m}
  KubeContainerWaiting: {for: 1m}
  KubeNodePressure: {for: 1m}

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
    secrets:
      - vigil-webhook-secret
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: 'vigil-webhook'
      group_by: ['...']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: 'null'
          matchers:
            - alertname =~ "InfoInhibitor|Watchdog"
    receivers:
      - name: 'null'
      - name: 'vigil-webhook'
        webhook_configs:
          - url: 'http://10.250.0.20:9099/webhook'
            send_resolved: false
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/vigil-webhook-secret/token
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info
        equal:
          - namespace
          - alertname
