apiVersion: v1
kind: ConfigMap
metadata:
  name: vigil-app-nginx-config
  namespace: default
data:
  default.conf.template: |
    server {
        listen 80;
        location = /healthz {
            proxy_pass ${REQUIRED_API_BASE};
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
            access_log off;
        }
        location / {
            proxy_pass ${REQUIRED_API_BASE};
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }
    }
