apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vigil-eval-runner-node-lease
  namespace: kube-node-lease
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vigil-eval-runner-node-lease
  namespace: kube-node-lease
subjects:
  - kind: ServiceAccount
    name: vigil-eval-runner
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vigil-eval-runner-node-lease
