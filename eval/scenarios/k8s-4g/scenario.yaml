id: k8s-4g
name: bogus-nodeselector-committed
layer: k8s
relationship: single
detection: alert
expected_action: git_commit_k8s

root_cause_component: "vigil-app.yaml committed nodeSelector: {kubernetes.io/hostname: nonexistent-bogus-node} on chore/eval-cluster-baseline; pods enter Pending because no node matches the selector"
expected_resolution_path: "diagnosis -> git_commit_k8s -> gate_pass -> reconcile -> watchdog_confirm"

inject_params:
  manifest: infra/overlays/hetzner/kubernetes/clusters/hetzner/apps/vigil-app.yaml
  deployment: vigil-app
  namespace: default
  bad_node_selector: "nonexistent-bogus-node"

alert_name: KubePodNotReady

verify_broken:
  symptom: pod_not_ready
  deployment: vigil-app
  namespace: default
  timeout_s: 60

faults:
