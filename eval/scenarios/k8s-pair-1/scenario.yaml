id: k8s-pair-1
name: phase-1c-two-fault-smoke
layer: cross
relationship: independent
detection: synthetic
root_cause_component: "vigil-app mem-load 32Mi OOM + vigil-worker-1 bridge-nf-call-iptables=0"
expected_action: git_commit_k8s
expected_resolution_path: "two sequential runs under _RUN_LOCK"
alert_name: KubeContainerOOMKilled
root_cause_keywords: ["memory", "limit", "OOM"]

faults:
  - id: a 
    component: deployment/vigil-app
    manifest: infra/overlays/hetzner/kubernetes/clusters/hetzner/apps/vigil-app.yaml
    expected_action: git_commit_k8s
    root_cause_keywords: ["memory", "limit", "OOM"]
    alert_name: KubeContainerOOMKilled
    severity: user_facing
    inject_params:
      deployment: vigil-app
      namespace: default
    verify_broken:
      symptom: pod_not_ready
      deployment: vigil-app
      namespace: default
      timeout_s: 120
    health_probe:
      kind: kube_condition
      resource: deployment/vigil-app
      namespace: default
      condition: Available
      expect: "True"
      window_s: 300
  - id: b 
    component: vigil-worker-1
    expected_action: nixos_rebuild
    root_cause_keywords: ["sysctl", "bridge-nf-call-iptables"]
    alert_name: KubePodNotReady
    severity: user_facing
    inject_params:
      target_host: vigil-worker-1
      namespace: default
      deployment: vigil-app
    verify_broken:
      symptom: sysctl_modified
      host: vigil-worker-1
      key: net.bridge.bridge-nf-call-iptables
      expected_value: "0"
      timeout_s: 30
    health_probe:
      kind: host_cmd
      host: vigil-worker-1
      command: "sysctl -n net.bridge.bridge-nf-call-iptables"
      expect: "1"
      window_s: 300