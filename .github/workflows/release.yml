name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name != 'v1.0.0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      checks: read
    env:
      TAG: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - name: Check version and changelog
        run: |
          version="${TAG#v}"
          project_version="$(uv version --short --frozen)"
          if [ "$project_version" != "${version/-rc./rc}" ]; then
            echo "::error::pyproject.toml version $project_version does not match tag $TAG"
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Require a green ci-gate on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=ci-gate" > "$RUNNER_TEMP/check-runs.json"
          if ! jq -e 'any(.check_runs[]; .conclusion == "success")' "$RUNNER_TEMP/check-runs.json" > /dev/null; then
            echo "::error::ci-gate has not succeeded on $SHA; wait for a green ci-gate before tagging"
            exit 1
          fi

      - name: Copy the release notes from the changelog
        run: |
          heading="## [${TAG#v}]"
          awk -v heading="$heading" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md section $heading is empty"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-rc.* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
